name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Banco PostgreSQL temporário, só para os testes
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx oxlint
      - run: npm run build
